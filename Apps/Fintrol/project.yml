name: Fintrol
options:
  bundleIdPrefix: mx.9866
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  transitivelyLinkDependencies: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    VALIDATE_PRODUCT: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "449S639443"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # SECURITY_AUDIT.md M-02: Enhanced Security tried and reverted — see SECURITY.md §9 item 9
    # and PROJECT_LEARNINGS.md FIN-2026-004. Forces ARCHS=arm64e on the app target, but the
    # local `AppleAppLabUI` SPM package keeps building plain arm64, so the app fails to link
    # against it ("built for incompatible target"). Needs a real fix (or an accepted/dated
    # deferral confirmed by Ivan), not a blind re-enable.
    # ENABLE_ENHANCED_SECURITY: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  AppleAppLabUI:
    path: ../../Packages/AppleAppLabUI

targets:
  Fintrol:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Fintrol
    dependencies:
      - package: AppleAppLabUI
        product: AppleAppLabUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.9866.fintrol
        PRODUCT_NAME: Fintrol
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fintrol
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Fintrol usa Face ID para proteger el acceso a tu presupuesto."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Fintrol/Fintrol-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Fintrol/Fintrol-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # SECURITY_AUDIT.md L-01: cosmetic-only — `com.apple.security.app-sandbox=true` in
        # Fintrol-macOS.entitlements is what codesign actually reads and enforces; this build
        # setting just keeps Xcode's Signing & Capabilities UI from showing a stale "off" state.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets:
        - FintrolTests
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": false

  FintrolTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FintrolTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.9866.fintrol.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fintrol.app/Fintrol"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Fintrol.app/Contents/MacOS/Fintrol"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Fintrol
